[project]
name = "motherduck-fastmcp-workshop"
version = "0.1.0"
description = "Build an MCP server over San Francisco 311 data and run it on FastMCP Gateway."
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = false
